name: Build NUSA APRS ESP32 REV1T

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI 1.5.1 and ESP32 Core 3.3.11
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz' -o /tmp/arduino-cli.tgz
          tar -xzf /tmp/arduino-cli.tgz -C /tmp
          sudo install -m 0755 /tmp/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls 'https://espressif.github.io/arduino-esp32/package_esp32_index.json'
          arduino-cli core update-index
          arduino-cli core install 'esp32:esp32@3.3.11'

      - name: Compile REV1T
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nusa-build
          arduino-cli compile --fqbn 'esp32:esp32:esp32' --build-path /tmp/nusa-build 'source/NUSA_APRS_IGATE_DIGI_REV1T_GPS_TRACKER'

      - name: Build four-BIN package
        shell: bash
        run: |
          set -euo pipefail
          OUT='firmware/bin'
          mkdir -p "$OUT"
          cp '/tmp/nusa-build/NUSA_APRS_IGATE_DIGI_REV1T_GPS_TRACKER.ino.bootloader.bin' "$OUT/bootloader.bin"
          cp '/tmp/nusa-build/NUSA_APRS_IGATE_DIGI_REV1T_GPS_TRACKER.ino.partitions.bin' "$OUT/partitions.bin"
          cp '/tmp/nusa-build/boot_app0.bin' "$OUT/boot_app0.bin"
          cp '/tmp/nusa-build/NUSA_APRS_IGATE_DIGI_REV1T_GPS_TRACKER.ino.bin' "$OUT/firmware.bin"
          (
            cd "$OUT"
            sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin > SHA256SUMS.txt
          )
          printf '%s\n'             '0x1000 bootloader.bin'             '0x8000 partitions.bin'             '0xE000 boot_app0.bin'             '0x10000 firmware.bin' > "$OUT/FLASH_OFFSETS.txt"

      - name: Commit generated binaries if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/bin
          if git diff --cached --quiet; then
            echo 'Firmware binaries already match REV1T source.'
            exit 0
          fi
          git commit -m 'build: refresh REV1T four-BIN package [skip ci]'
          git push
