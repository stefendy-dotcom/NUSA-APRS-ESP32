name: Repack REV1T Firmware ZIP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repack-rev1t-firmware-only.yml'

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout REV1T release commit
        uses: actions/checkout@v4
        with:
          ref: 3fba47151ce3cf2c29068579d971678a52c527bb

      - name: Create firmware-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd firmware/bin
          zip -9 -j ../../release/NUSA_APRS_ESP32_REV1T_FLASH.zip             bootloader.bin             partitions.bin             boot_app0.bin             firmware.bin
          cd ../../release
          unzip -l NUSA_APRS_ESP32_REV1T_FLASH.zip
          sha256sum NUSA_APRS_ESP32_REV1T_FLASH.zip

      - name: Replace REV1T release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload REV1T release/NUSA_APRS_ESP32_REV1T_FLASH.zip --clobber
          gh release edit REV1T             --title 'NUSA APRS ESP32 REV1T — GPS Tracker + Auto Mode'             --notes 'REV1T GPS Tracker + Auto Mode Switch. Firmware ZIP contains only the four flashable BIN files: bootloader.bin, partitions.bin, boot_app0.bin, and firmware.bin.'
