name: Create REV1S Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-rev1s.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: d50ccd9cb1595cc2601a2bfe42f847877a39bf2e
          fetch-depth: 0

      - name: Build flash package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/NUSA_APRS_ESP32_REV1S
          cp firmware/bin/bootloader.bin release/NUSA_APRS_ESP32_REV1S/
          cp firmware/bin/partitions.bin release/NUSA_APRS_ESP32_REV1S/
          cp firmware/bin/boot_app0.bin release/NUSA_APRS_ESP32_REV1S/
          cp firmware/bin/firmware.bin release/NUSA_APRS_ESP32_REV1S/
          cp firmware/bin/FLASH_OFFSETS.txt release/NUSA_APRS_ESP32_REV1S/
          cp firmware/bin/SHA256SUMS.txt release/NUSA_APRS_ESP32_REV1S/
          cp firmware/bin/README.md release/NUSA_APRS_ESP32_REV1S/
          cd release
          zip -9 -r NUSA_APRS_ESP32_REV1S_FLASH.zip NUSA_APRS_ESP32_REV1S

      - name: Write release notes
        shell: bash
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          # NUSA APRS ESP32 REV1S

          REV1S preserves the proven REV1R receive/decoder engine and adds RF Remote Admin while retaining the APRS iGate, digipeater, APRS-IS, Web UI, OLED, weather, and diagnostics features.

          ## Highlights

          - Bell 202 / AX.25 APRS 1200 baud RX/TX.
          - Parallel RX decoder engine: Decoder A, B-RAW, B-EQ125, and B-EQ130.
          - RF -> APRS-IS iGate.
          - WIDE APRS digipeater.
          - Local APRS-IS -> RF message gating with heard filter.
          - RF Remote Admin for two exact callsign+SSID administrators.
          - Short RF commands for DIGI, IGATE, IS->RF, beacons, RX/TX settings, path, aliases, OLED, SAVE, CANCEL, and REBOOT.
          - Indonesian and English RF Remote Admin documentation now includes the purpose, valid ranges, reply meanings, and usage examples for every short command.
          - SH1106/SSD1306 OLED support.
          - Web configuration, live monitor, last-heard lists, weather parsing, RX WAV diagnostics, and decoder telemetry.

          ## Flash package

          The attached ZIP contains the four ESP32 binaries and flash information:

          - 0x1000 - bootloader.bin
          - 0x8000 - partitions.bin
          - 0xE000 - boot_app0.bin
          - 0x10000 - firmware.bin
          - FLASH_OFFSETS.txt
          - SHA256SUMS.txt
          - README.md

          Target: Classic ESP32 WROOM / DevKit, 4 MB flash, Arduino-ESP32 Core 3.3.11.

          ## RF Remote Admin security

          Exact callsign+SSID whitelisting is an operational control, not cryptographic authentication. APRS source callsigns can be spoofed.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view REV1S >/dev/null 2>&1; then
            gh release edit REV1S --title "NUSA APRS ESP32 REV1S" --notes-file release/RELEASE_NOTES.md
            gh release upload REV1S release/NUSA_APRS_ESP32_REV1S_FLASH.zip --clobber
          else
            gh release create REV1S               --target d50ccd9cb1595cc2601a2bfe42f847877a39bf2e               --title "NUSA APRS ESP32 REV1S"               --notes-file release/RELEASE_NOTES.md               release/NUSA_APRS_ESP32_REV1S_FLASH.zip
          fi
