name: Repack REV1T Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repack-rev1t.yml"

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated REV1T files
        uses: actions/checkout@v4
        with:
          ref: d859f90a217d3863ae32ca2df4ed4353b927b124

      - name: Create clean four-BIN ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd firmware/bin
          zip -9 ../../release/NUSA_APRS_ESP32_REV1T_FLASH.zip             bootloader.bin partitions.bin boot_app0.bin firmware.bin
          cd ../../release

          # The ZIP must contain exactly four files and all must be .bin.
          mapfile -t FILES < <(zipinfo -1 NUSA_APRS_ESP32_REV1T_FLASH.zip)
          printf 'ZIP CONTENTS:\n'
          printf '  %s\n' "${FILES[@]}"
          test "${#FILES[@]}" -eq 4
          printf '%s\n' "${FILES[@]}" | grep -qx 'bootloader.bin'
          printf '%s\n' "${FILES[@]}" | grep -qx 'partitions.bin'
          printf '%s\n' "${FILES[@]}" | grep -qx 'boot_app0.bin'
          printf '%s\n' "${FILES[@]}" | grep -qx 'firmware.bin'
          if printf '%s\n' "${FILES[@]}" | grep -vqE '^(bootloader|partitions|boot_app0|firmware)\.bin$'; then
            echo 'Unexpected file in ZIP'
            exit 1
          fi

          sha256sum NUSA_APRS_ESP32_REV1T_FLASH.zip > REV1T_RELEASE_SHA256.txt

      - name: Write concise release notes
        shell: bash
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          # NUSA APRS ESP32 REV1T — GPS Tracker

          REV1T adalah **REV1S + GPS Tracker**. Engine RX AFSK/AX.25, iGate, dan digipeater REV1S dipertahankan; GPS tracker ditambahkan secara modular dan non-blocking.

          ## Download firmware

          Asset **`NUSA_APRS_ESP32_REV1T_FLASH.zip` hanya berisi 4 file BIN**:

          | Offset | File |
          |---:|---|
          | `0x1000` | `bootloader.bin` |
          | `0x8000` | `partitions.bin` |
          | `0xE000` | `boot_app0.bin` |
          | `0x10000` | `firmware.bin` |

          Target: **Classic ESP32 WROOM / ESP32 DevKit, flash 4 MB, Arduino-ESP32 Core 3.3.11**.

          ## Connection GPS default

          | GPS / GNSS | ESP32 |
          |---|---|
          | GPS TX | GPIO16 — GPS UART RX |
          | GPS RX | GPIO17 — GPS UART TX, opsional |
          | GND | GND |
          | VCC | Sesuai spesifikasi modul GPS |

          Jika ESP32 hanya menerima NMEA, **GPS TX GPIO ESP32 dapat diset `-1`** sehingga jalur ESP32→GPS tidak diperlukan.

          **Jangan gunakan GPIO36 atau GPIO26 untuk GPS.**
          - GPIO36 = APRS RX Audio ADC
          - GPIO26 = APRS AFSK TX DAC
          - default PTT = GPIO25
          - default RX LED = GPIO2
          - default TX LED = GPIO4
          - default OLED SDA/SCL = GPIO21/GPIO22

          Firmware memberikan warning dan tidak menjalankan GPS UART bila pin GPS konflik dengan pin kritis aktif.

          ## GPS yang didukung

          - u-blox NEO-6M
          - u-blox NEO-M8N
          - u-blox NEO-M10N
          - GPS/GNSS lain yang mengeluarkan NMEA RMC/GGA standar
          - baud: **9600 / 38400 / 115200**

          ## Fitur tracker REV1T

          - Position Mode: **STATIC / GPS / AUTO**
          - Tracker Output: **RF / APRS-IS / RF + APRS-IS**
          - Tracker RF Path default: **WIDE2-1**
          - Fixed Interval
          - SmartBeaconing + corner pegging
          - Stationary protection
          - GPS stale/fix protection
          - Manual Tracker Beacon
          - Web UI live GPS
          - OLED GPS page
          - RF Remote Admin: `TRK`, `GPS`, `TMODE`, `TSEC`, `TPATH`, `TOUT`, `TBCN`

          Tracker default **OFF**, jadi upgrade dari REV1S tetap aman walaupun GPS belum dipasang.

          ## Dokumentasi lengkap

          Dokumentasi tidak dimasukkan ke ZIP firmware agar paket flash tetap sederhana:

          - [GPS Tracker Bahasa Indonesia](https://github.com/stefendy-dotcom/NUSA-APRS-ESP32/blob/main/docs/GPS_TRACKER_ID.md)
          - [GPS Tracker English](https://github.com/stefendy-dotcom/NUSA-APRS-ESP32/blob/main/docs/GPS_TRACKER_EN.md)
          - [User Guide Indonesia](https://github.com/stefendy-dotcom/NUSA-APRS-ESP32/blob/main/docs/USER_GUIDE_ID.md)
          - [RF Remote Admin Indonesia](https://github.com/stefendy-dotcom/NUSA-APRS-ESP32/blob/main/docs/RF_REMOTE_ADMIN_ID.md)
          - [GPS Wiring](https://github.com/stefendy-dotcom/NUSA-APRS-ESP32/blob/main/hardware/GPS_WIRING.md)

          ## Build / validation

          - application flash: **1,139,979 byte (86%)**
          - global RAM: **77,184 byte (23%)**
          - automated validation: **63/63 PASS**
          - GitHub Actions build: **SUCCESS**
          - file engine AFSK/AX.25/CRC/FIFO/HDLC REV1T byte-identik dengan REV1S

          SHA-256 `firmware.bin` hasil CI:

          `968c2bf25b97e54d0423509921eb88ebe411233d5033479656e36fcbd5ec95ed`
          EOF

      - name: Replace REV1T release assets and description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit REV1T             --repo "${GITHUB_REPOSITORY}"             --title "NUSA APRS ESP32 REV1T — GPS Tracker"             --notes-file release/RELEASE_NOTES.md

          gh release upload REV1T             --repo "${GITHUB_REPOSITORY}"             release/NUSA_APRS_ESP32_REV1T_FLASH.zip             release/REV1T_RELEASE_SHA256.txt             --clobber
